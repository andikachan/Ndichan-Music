name: Build Fork APK

on:
  workflow_dispatch:
  push:
    branches: ["ndichan/ios-edition"]

jobs:
  build:
    name: Build Ndichan Music Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/pr-debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Ndichan Music,O=Ndichan,C=ID"

      - name: Build FOSS Debug APK
        run: ./gradlew --console=plain assembleFossDebug --warning-mode summary -x lint
        env:
          METROLIST_DEBUG_KEYSTORE_PATH: pr-debug.keystore
          METROLIST_APPLICATION_ID: com.ndichan.music
          METROLIST_APP_NAME: Ndichan Music
          PULL_REQUEST: "true"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Ndichan-Music-iOS-Edition-APK
          path: app/build/outputs/apk/**/*.apk
          retention-days: 14
