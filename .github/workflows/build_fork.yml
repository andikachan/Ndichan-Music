name: Build Fork APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "ndichan/ios-edition"]

permissions:
  contents: write

jobs:
  build:
    name: Build Ndichan Music Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup persistent keystore
        run: |
          if [ ! -f app/persistent-debug.keystore ]; then
            echo "Generating permanent keystore..."
            keytool -genkeypair -v \
              -keystore app/persistent-debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Ndichan Music,O=Ndichan,C=ID"
            
            git config user.name "andikachan"
            git config user.email "andikachan@users.noreply.github.com"
            git add -f app/persistent-debug.keystore
            git commit -m "build(ci): add persistent debug keystore for seamless updates"
            git push origin HEAD:${{ github.ref_name }} || true
          else
            echo "Persistent keystore already exists. Reusing it."
          fi

      - name: Build FOSS Debug APK
        run: ./gradlew --console=plain assembleFossDebug --warning-mode summary -x lint
        env:
          METROLIST_DEBUG_KEYSTORE_PATH: persistent-debug.keystore
          METROLIST_APPLICATION_ID: com.ndichan.music
          METROLIST_APP_NAME: Ndichan Music
          PULL_REQUEST: "true"

      - name: Organize APK
        run: |
          mkdir -p output_apk
          BUILT_APK=$(find app/build/outputs/apk/foss/debug -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$BUILT_APK" ]; then
            BUILT_APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          fi
          echo "Found APK: $BUILT_APK"
          cp "$BUILT_APK" output_apk/Ndichan-Music-iOS-Edition.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Ndichan-Music-iOS-Edition-APK
          path: output_apk/Ndichan-Music-iOS-Edition.apk
          retention-days: 14

      - name: Update GitHub Release Assets
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ndichan/ios-edition'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' || echo "")
          if [ -n "$LATEST_TAG" ]; then
            echo "Uploading APK to latest release: $LATEST_TAG"
            gh release upload "$LATEST_TAG" output_apk/Ndichan-Music-iOS-Edition.apk --clobber || true
          fi
